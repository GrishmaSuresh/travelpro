<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.3/aos.css">
</head>
<body>
{% if submitted %}
    <div class="card" style="width:400px;height: 200px;margin-left: 500px;margin-top: 200px">
        <div class="card-header">
            Message
        </div>
        <div class="card-body">
            <h5 class="card-title">BLOG POSTED</h5>
            <p class="card-text">You have successfully submitted your post!!!</p>
            <btn class="btn btn-primary" onclick="prevPage()">Back</btn>
        </div>
    </div>
{% else %}
    <div class="form-group">
        <form method="post" action="post" class="form-horizontal form-middle" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" value="submit">Save</button>
        </form>
    </div>
{% endif %}
</body>
</html>
<script>
    function prevPage() {
        window.location.href = 'blogs'
    }
</script>
