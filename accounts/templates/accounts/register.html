{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.3/aos.css">


    <title>LOGIN</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600&display=swap');

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-image: url("{% static 'web/images/bgg.jpg' %}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .container {
            width: 250px;
            display: flex;
            flex-direction: column;
            padding: 0 15px 0 15px;
        }

        span {
            color: #ffffff;
            font-size: small;
            display: flex;
            justify-content: center;
            padding: 10px 0 10px 52px;
        }

        .right{
                padding-left: 100px;
        }

        header {
            color: #ffffff;
            font-size: 30px;
            display: flex;
            justify-content: center;
            padding: 10px 0 10px 50px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        .input {
            height: 45px;
            width: 125%;
            border: none;
            outline: none;
            border-radius: 30px;
            color: #ffffff;
            padding: 0 0 0 42px;
            background: rgba(255, 255, 255, 0.2);
        }

        i {
            position: relative;
            top: -31px;
            left: 17px;
            color: #ffffff;
        }

        ::-webkit-input-placeholder {
            color: #ffffff;
        }

        .submit {
            border: none;
            border-radius: 30px;
            font-size: 15px;
            height: 45px;
            outline: none;
            width: 125%;
            background: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: .3s;
        }

        .submit:hover {
            box-shadow: 1px 5px 7px 1px rgba(0, 0, 0, 0.2);
        }

        .bottom {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            font-size: small;
            color: #ffffff;
            margin-top: 10px;
        }

        .left {
            display: flex;
        }

        label a {
            color: #ffffff;
            text-decoration: none;
        }
        .log {
            color: #ffffff;
            font-size: small;
            display: flex;
            justify-content: center;
            padding: 10px 0 10px 52px;
        }
    </style>

</head>
<body>

{% if messages %}
    {% for msg in messages %}

       <div class="alert alert-warning alert-dismissible fade show" role="alert">
  <strong>Hey!</strong> {{msg}}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

    {% endfor %}
{% endif %}
<form action="register" method="post">
    {% csrf_token %}
    <div class="box">
        <div class="container">
            <div class="top-header">
                <a class="log" href="login">Have an account?</a>
                <header>Register</header>
            </div>
            <div class="input-field">
                <input type="text" class="input" placeholder="Firstname" name="firstname" required>
                <i class="fas fa-user"></i>
            </div>

            <div class="input-field">
                <input type="text" class="input" placeholder="Lastname" name="lastname" required>
                <i class="fas fa-user"></i>
            </div>

            <div class="input-field">
                <input type="text" class="input" placeholder="Username" name="username" required>
                <i class="fas fa-user"></i>
            </div>

            <div class="input-field">
                <input type="email" class="input" placeholder="Email" name="email" required>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="input-field">
                <input type="password" class="input" placeholder="Password" name="password" required>
                <i class="fas fa-lock"></i>
            </div>

            <div class="input-field">
                <input type="submit" class="submit" value="Register">
            </div>



        </div>
    </div>
</form>



</body>
</html>
